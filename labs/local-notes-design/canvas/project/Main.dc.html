<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>홈 · 첫 실행 빈 상태</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
*{box-sizing:border-box}
</style>
</helmet>
<div style="width:360px;height:800px;background:#0E1217;color:#C8D2DC;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 32px;text-align:center">
    <div style="width:52px;height:52px;border-radius:16px;background:#1B232D;display:flex;align-items:center;justify-content:center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6EA8FE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="새 노트"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </div>
    <h1 style="margin:0;font-size:22px;font-weight:700;color:#E6EDF3;letter-spacing:-0.01em">아직 노트가 없습니다</h1>
    <p style="margin:0;font-size:14px;line-height:1.6;color:#9AA7B4;max-width:284px">직접 쓰거나 다른 앱의 글과 .md 파일을 가져와 노트를 만드세요.</p>
    <div style="display:flex;flex-direction:column;gap:12px;width:240px;margin-top:8px">
      <button style="height:48px;border:none;border-radius:12px;background:#6EA8FE;color:#0E1217;font-size:15.5px;font-weight:700;cursor:pointer">새 노트</button>
      <button style="height:48px;border:1px solid #283039;border-radius:12px;background:#1B232D;color:#E6EDF3;font-size:15.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA7B4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        가져오기
      </button>
    </div>
  </div>
  <div style="padding:0 32px 40px;display:flex;flex-direction:column;align-items:center;gap:6px">
    <span style="font-size:13px;color:#687585">GitHub 저장소에 노트가 있다면</span>
    <button style="background:none;border:none;color:#9AA7B4;font-size:13px;font-weight:600;cursor:pointer;padding:4px 8px">저장소 연결</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
