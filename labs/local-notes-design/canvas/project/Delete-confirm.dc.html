<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>지우기 확인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
*{box-sizing:border-box}
</style>
</helmet>
<div style="width:360px;height:800px;background:#0E1217;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;position:relative;overflow:hidden">
  <div style="position:absolute;inset:0;padding:20px;opacity:0.3;filter:saturate(0.6)">
    <div style="height:36px"></div>
    <div style="font-size:28px;font-weight:700;color:#E6EDF3;letter-spacing:-0.015em">Kotlin 제네릭</div>
    <div style="margin-top:10px;font-size:13px;color:#687585">이 기기 · 2026-11-08에 만듦</div>
    <div style="margin-top:22px;height:14px;width:90%;background:#283039;border-radius:4px"></div>
    <div style="margin-top:10px;height:14px;width:80%;background:#283039;border-radius:4px"></div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(6,9,12,0.66)"></div>
  <div style="position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%);background:#1A2230;border:1px solid rgba(255,255,255,0.09);border-radius:20px;padding:22px;box-shadow:0 18px 48px rgba(0,0,0,0.45)">
    <h2 style="margin:0 0 10px;font-size:19px;font-weight:700;color:#E6EDF3">이 노트를 지울까요?</h2>
    <p style="margin:0 0 20px;font-size:14px;line-height:1.6;color:#9AA7B4">노트와 북마크를 지웁니다. 학습 기록은 남습니다. 되돌릴 수 없습니다.</p>
    <div style="display:flex;justify-content:flex-end;gap:8px">
      <button style="background:none;border:none;color:#9AA7B4;font-size:15px;font-weight:600;padding:10px 14px;cursor:pointer">취소</button>
      <button style="border:none;border-radius:12px;background:#FF7A85;color:#0E1217;font-size:15px;font-weight:700;padding:10px 20px;cursor:pointer">지우기</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
