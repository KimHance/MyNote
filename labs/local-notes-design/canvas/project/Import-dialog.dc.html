<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>가져오기 대화상자</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
*{box-sizing:border-box}
</style>
</helmet>
<div style="width:360px;height:800px;background:#0E1217;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;position:relative;overflow:hidden">
  <div style="position:absolute;inset:0;padding:16px;opacity:0.35;filter:saturate(0.6)">
    <div style="font-size:21px;font-weight:700;color:#E6EDF3">MyNote</div>
    <div style="margin-top:46px;height:76px;background:#161C24;border:1px solid #283039;border-radius:16px"></div>
    <div style="margin-top:12px;height:76px;background:#161C24;border:1px solid #283039;border-radius:16px"></div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(6,9,12,0.66)"></div>
  <div style="position:absolute;left:16px;right:16px;bottom:16px;background:#1A2230;border:1px solid rgba(255,255,255,0.09);border-radius:20px;padding:20px;box-shadow:0 18px 48px rgba(0,0,0,0.45)">
    <h2 style="margin:0 0 6px;font-size:19px;font-weight:700;color:#E6EDF3">무엇을 가져올까요?</h2>
    <p style="margin:0 0 16px;font-size:14px;line-height:1.6;color:#9AA7B4">가져온 글은 새 노트로 열립니다. 저장해야 노트가 됩니다.</p>
    <button style="width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:#1B232D;border:1px solid #283039;border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9AA7B4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
      <span style="flex:1"><span style="display:block;font-size:15px;font-weight:600;color:#E6EDF3">파일 열기</span><span style="display:block;font-size:13px;color:#687585;margin-top:2px">.md나 .markdown 파일</span></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#687585" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </button>
    <button style="width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:#1B232D;border:1px solid #283039;border-radius:12px;padding:14px;margin-bottom:14px;cursor:pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9AA7B4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
      <span style="flex:1"><span style="display:block;font-size:15px;font-weight:600;color:#E6EDF3">붙여넣기</span><span style="display:block;font-size:13px;color:#687585;margin-top:2px">다른 앱에서 복사한 글</span></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#687585" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </button>
    <p style="margin:0 0 8px;font-size:13px;line-height:1.5;color:#687585">다른 앱의 공유 메뉴에서 MyNote를 골라도 됩니다.</p>
    <div style="display:flex;justify-content:flex-end">
      <button style="background:none;border:none;color:#9AA7B4;font-size:15px;font-weight:600;padding:8px 10px;cursor:pointer">취소</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
