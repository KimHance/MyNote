[versions]
appVersionCode = "1"
appVersionName = "1.0"
agp = "9.4.1"
compileSdk = "37"
targetSdk = "36"
minSdk = "32"
desugarJdkLibs = "2.1.5"

# kotlin
kotlin = "2.4.20"
kotlinxSerializationJson = "1.11.0"
kotlinxImmutable = "0.5.2"

# androidx
androidxCore = "1.19.0"
androidxActivity = "1.13.0"
androidxLifecycle = "2.11.0"
androidxDatastore = "1.2.1"
androidxRoom3 = "3.0.3"
androidxComposeBom = "2026.09.00"

# compose
composeMaterial3 = "1.4.0"
backdrop = "2.0.1"
litertlm = "0.17.0"

navigation3 = "1.1.7"
nav3Material = "1.3.0"
lifecycleViewmodelNav3 = "2.11.0"

# coroutine
coroutine = "1.11.0"


# ksp
ksp = "2.3.6"

# hilt
hilt = "2.60.1"
androidxHilt = "1.4.0"
hiltNavigationCompose = "1.4.0"

# test
junit = "4.13.2"
ui-test-junit4 = "1.12.1"

# work
work = "2.12.0"

# network
retrofit = "3.0.0"
okhttp = "5.5.0"

# lint / format
ktlintGradle = "14.2.0"
ktlint = "1.8.0"
composeRules = "0.6.6"
composeLints = "1.6.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }

hancenote-android-application = { id = "hancenote.android.application" }
hancenote-android-application-compose = { id = "hancenote.android.application.compose" }
hancenote-android-library = { id = "hancenote.android.library" }
